[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }

log = { version = "0.4.21", features = [
    "max_level_debug",
    "release_max_level_info",
] }

sha2 = "0.10.8"

rand = "0.8.5"

serde = "1.0.198"

bytes = "1.6.0"

flume = { version = "0.11.0", features = ["async"] }

[profile.release]
# codegen-units = 1
lto = "thin"

