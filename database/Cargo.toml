[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }

log = { version = "0.4.21", features = [
    "max_level_debug",
    "release_max_level_info",
] }

sha2 = "0.10.8"

chrono = "0.4.38"

rand = "0.8.5"

serde = "1.0.198"

rayon = "1.10.0"
parking_lot = { version = "0.12.1", features = ["nightly"] }
flume = { version = "0.11.0", features = ["async"] }
thread_local = "1.1.8"

[profile.release]
# codegen-units = 1
lto = "thin"

# [build]
# rustflags = ["-C", "target-cpu=native"]
