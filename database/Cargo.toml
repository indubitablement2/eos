[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
log = { version = "0.4.21", features = [
    "max_level_debug",
    "release_max_level_info",
] }
anyhow = "1.0.82"

ahash = { version = "0.8.11", features = ["serde"] }
indexmap = { version = "2.2.6", features = [] }
smallvec = { version = "1.13.2", features = ["serde", "union"] }
dashmap = { version = "5.5.3", features = ["serde"] }

sha2 = "0.10.8"

# chrono = "0.4.38"

rand = "0.8.5"

serde = "1.0.198"
serde_json = "1.0.116"
postcard = { version = "1.0.8", features = [
    "use-std",
], default-features = false }

# rayon = "1.10.0"
# parking_lot = { version = "0.12.1", features = ["nightly"] }
flume = { version = "0.11.0", features = ["async"] }
# thread_local = "1.1.8"

tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = "0.21.0"
tokio-util = { version = "0.7.10", features = ["codec"] }
futures-util = "0.3.30"

sysinfo = { version = "0.30.11", default-features = false }

[profile.release]
# codegen-units = 1
lto = "thin"

# [build]
# rustflags = ["-C", "target-cpu=native"]
