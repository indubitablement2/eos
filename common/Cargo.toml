[package]
name = "common"
version = "0.1.0"
edition = "2021"

[dependencies]
log = { version = "0.4.21" }
anyhow = "1.0.82"

broccoli = "6.3.0"
rapier2d = { version = "0.19.0", features = ["simd-stable"] }
# nalgebra = { version = "0.32.5", features = ["serde-serialize"] }
glam = { version = "0.27.0", features = ["serde", "scalar-math"] }

ahash = { version = "0.8.11", features = ["serde"] }
indexmap = { version = "2.2.6", features = [] }
smallvec = { version = "1.13.2", features = ["serde", "union"] }
# heapless = "0.8.0"
# slotmap = "1.0.7"

rand = "0.8.5"

serde = "1.0.198"
serde_json = "1.0.116"
postcard = { version = "1.0.8", features = [
    "use-std",
], default-features = false }
# bitcode = "0.6.0"

parking_lot = { version = "0.12.1", features = ["nightly"] }
flume = { version = "0.11.0", features = ["async"] }

tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = "0.21.0"
tokio-util = { version = "0.7.10", features = ["codec"] }
futures-util = "0.3.30"
